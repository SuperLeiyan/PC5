name: An idea for PC5
description: Something PC5 could do that it doesn't yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What PC5 would do, and where (the library, a game's △ menu, Settings).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it would help with
      description: A game it would help, for example.
    validations:
      required: false
