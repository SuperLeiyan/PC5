title: "[Idea] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        An idea for PC5: something it could do that it doesn't yet. One idea per discussion; if someone has posted yours already, give it a 👍 and add to it there.

        **A game that doesn't run, or PC5 not working: open an [issue](https://github.com/bornaradusin/PC5/issues/new/choose) instead**, with its log.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What PC5 would do, and where (the library, a game's △ menu, Settings).
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it would help with
      description: A game it would help, for example, or what you do now instead.
    validations:
      required: false
  - type: input
    id: pc5
    attributes:
      label: PC5 version
      description: "**Settings › About PC5** (press Options in the library)."
      placeholder: "Example: 1.8.8"
    validations:
      required: false
